name: Release freedom WinUI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2rayN
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: x64
            package: freedom-windows-64
          - rid: win-arm64
            platform: ARM64
            package: freedom-windows-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish WinUI and updater
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            [xml]$props = Get-Content Directory.Build.props
            $version = [string]($props.Project.PropertyGroup.Version | Select-Object -First 1)
          }
          $appOutput = Join-Path $env:RUNNER_TEMP "app-${{ matrix.rid }}"
          $toolOutput = Join-Path $env:RUNNER_TEMP "tool-${{ matrix.rid }}"
          $packageRoot = Join-Path $env:RUNNER_TEMP "${{ matrix.package }}"

          dotnet publish v2rayN.WinUI/v2rayN.WinUI.csproj `
            -c Release -r "${{ matrix.rid }}" --self-contained true `
            -p:Platform="${{ matrix.platform }}" -p:Version=$version -p:PublishSingleFile=false -warnaserror -o $appOutput
          dotnet publish AmazTool/AmazTool.csproj `
            -c Release -r "${{ matrix.rid }}" --self-contained true `
            -p:Version=$version -p:PublishSingleFile=true -warnaserror -o $toolOutput

          $requiredResources = @(
            'freedom.pri',
            'App.xbf',
            'MainWindow.xbf',
            'Views/UpdateManagerView.xbf',
            'Assets/freedom.ico'
          )
          foreach ($relativePath in $requiredResources) {
            if (-not (Test-Path -LiteralPath (Join-Path $appOutput $relativePath) -PathType Leaf)) {
              throw "WinUI publish resource is missing: $relativePath"
            }
          }

          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item (Join-Path $appOutput '*') $packageRoot -Recurse -Force
          Copy-Item (Join-Path $toolOutput 'AmazTool.exe') $packageRoot -Force
          Compress-Archive -Path $packageRoot -DestinationPath "${{ matrix.package }}.zip" -Force
          $zip = "${{ matrix.package }}.zip"
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n", [Text.UTF8Encoding]::new($false))

      - name: Build self-contained installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            [xml]$props = Get-Content Directory.Build.props
            $version = [string]($props.Project.PropertyGroup.Version | Select-Object -First 1)
          }
          ./installer/build-installer.ps1 -Version $version
          Copy-Item "artifacts/installer/v$version/output/freedom-windows-64-setup.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            v2rayN/${{ matrix.package }}.zip
            v2rayN/${{ matrix.package }}.zip.sha256

      - uses: actions/upload-artifact@v4
        if: matrix.rid == 'win-x64'
        with:
          name: freedom-windows-64-setup
          path: v2rayN/freedom-windows-64-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: freedom-windows-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            freedom-windows-*.zip
            freedom-windows-*.zip.sha256
            freedom-windows-*-setup.exe
